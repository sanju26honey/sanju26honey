name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_activity: yes
          base_skiplist: pull_requests_reviewed, pull_requests_opened, issues_opened, releases, packages, added, removed
          plugin_activity_filter: push, pr, review
          repository_affiliations: owner, collaborator, organization_member
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_languages: yes
          plugin_habits: yes
          plugin_achievements: yes
